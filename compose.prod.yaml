services:
  php:
    environment:
      XDEBUG_MODE: "off"

  message-queue:
    environment:
      XDEBUG_MODE: "off"

  scheduler:
    environment:
      XDEBUG_MODE: "off"

  db:
    ports: !override []

  caddy:
    ports: !override
      - "127.0.0.1:8091:80"
    volumes: !override
      - .:/var/www/html
      - ./.docker/caddy/etc/caddy/Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  mailpit: !reset null
